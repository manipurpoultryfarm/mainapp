name: Build MPF Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MPF_Android_App_WITH_MPF_ICON

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build MPF APK
        run: gradle assembleDebug

      - name: Upload MPF APK
        uses: actions/upload-artifact@v4
        with:
          name: MPF-Android-APK
          path: MPF_Android_App_WITH_MPF_ICON/app/build/outputs/apk/debug/*.apk
